name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name (e.g. 0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark as pre-release
        required: true
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ inputs.version }}
      VERSION_CODE: ${{ github.run_number }}
      RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Validate version
        run: |
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Invalid version: $VERSION_NAME"; exit 1; }
          if gh release view "v$VERSION_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release v$VERSION_NAME already exists"; exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE"

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Verify signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$RELEASE_KEYSTORE"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="UnofficialMonsender-$VERSION_NAME.apk"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "v$VERSION_NAME" "$apk" "$apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION_NAME" \
            --generate-notes \
            ${{ inputs.prerelease && '--prerelease' || '' }}
